<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1a14"><title>OpenCity</title>
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="city-loading.css"><link rel="stylesheet" href="vehicle-shell.css"><link rel="stylesheet" href="cockpit.css"><link rel="stylesheet" href="mobile-controls.css"><link rel="stylesheet" href="flight.css"><link rel="stylesheet" href="auto.css"><link rel="stylesheet" href="driving-hud.css"><link rel="stylesheet" href="multiplayer-client.css"><link rel="stylesheet" href="resume-overlay.css"><link rel="stylesheet" href="controller-monitor.css"><link rel="stylesheet" href="performance-panel.css"><link rel="stylesheet" href="voice-chat.css"><link rel="stylesheet" href="social-controls.css"><link rel="stylesheet" href="mobile-drive.css"><link rel="stylesheet" href="mobile-menu.css"><link rel="stylesheet" href="focus-pointer.css"><link rel="stylesheet" href="mobile-dashboard.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body class="city-booting">
<section id="city-loading" aria-label="Loading OpenCity"><div class="loading-card"><div class="loading-orbit" aria-hidden="true"></div><h1>OpenCity</h1><p class="loading-place">Bengaluru. Your city to explore.</p><progress max="4" value="0" aria-label="City preparation"></progress><p role="status" aria-live="polite">Building Bengaluru…</p><button type="button" hidden>Retry loading</button></div></section>
<div id="ride-brand"><strong>Bengaluru</strong><span id="build-version">Loading version…</span></div>
<section id="vehicle-picker" aria-label="Vehicles"><h2>Pick a ride</h2><button data-ride="helicopter" disabled>Helicopter <small>Fly →</small></button><button data-ride="cybercab" disabled>Cybercab</button><button data-ride="cybertruck" disabled>Cybertruck</button><button data-ride="auto" disabled>Auto <small>Drive →</small></button><button data-ride="kitt" disabled>Knight Rider</button><button data-ride="yulu" disabled>Yulu <small>Ride →</small></button><button data-ride="delivery" disabled>Delivery <small>Ride →</small></button><p id="vehicle-entry-status" role="status">Loading city…</p></section>
<main id="map" aria-label="Interactive three-dimensional map of Bengaluru"></main>
<aside inert aria-hidden="true" class="rail" aria-label="City explorer">
 <header><span class="brandmark" aria-hidden="true">ಬ</span><div><strong>Bengaluru</strong><span class="sub">Living City · CBD study</span></div><button id="collapse" aria-label="Toggle explorer controls" aria-expanded="true">−</button></header>
 <nav aria-label="Explorer sections"><button type="button" data-panel="districts" aria-current="page">Districts</button><button type="button" data-panel="landmarks">Landmarks</button><button type="button" data-panel="routes">Routes</button></nav>
 <section id="districts" aria-labelledby="districts-heading"><h2 id="districts-heading">Districts</h2><ul id="district-list"></ul></section>
 <section id="landmarks" hidden aria-labelledby="landmarks-heading"><h2 id="landmarks-heading">Landmarks</h2><ul id="landmark-list"></ul></section>
 <section id="routes" hidden aria-labelledby="routes-heading"><h2 id="routes-heading">Routes</h2><p>Drive or fly preset routes through the CBD.</p></section>
</aside>
<script type="module" src="app.js"></script>
<script>navigator.serviceWorker?.register('sw.js?v='+Date.now()).catch(()=>{});</script>
</body>
</html>
