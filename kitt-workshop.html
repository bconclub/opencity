<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KITT model workshop | OpenCity</title>
<style>body{margin:0;background:#11191d;color:#f2f4f3;font:14px system-ui}header{position:absolute;z-index:2;top:20px;left:24px;right:24px;pointer-events:none}h1{font-size:24px;margin:4px 0}header p{color:#a9b7ba;margin:6px 0;max-width:560px}nav{position:absolute;z-index:3;bottom:24px;left:24px;right:24px;display:flex;gap:8px;flex-wrap:wrap}button,select{min-height:44px;border:1px solid #64747d;border-radius:8px;padding:10px 15px;background:#1d2b32;color:white;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#48756a}#stats{font-variant-numeric:tabular-nums;color:#b4c7ce}canvas{display:block;touch-action:none}@media(max-width:480px){header{top:12px;left:16px}h1{font-size:20px}nav{bottom:16px;left:16px;right:16px;gap:5px}button,select{padding:8px 10px;font-size:12px}header p{font-size:12px;max-width:90%}}</style>
<header><small>OPENCITY / WORK IN PROGRESS</small><h1>KITT model workshop</h1><p>Drag to inspect. Compare geometry and test wheel motion. Candidate is an original reconstruction, not manufacturer CAD.</p><div id="stats">Loading models...</div></header>
<nav><select id="asset" aria-label="Model"><option value="candidate">Revised model</option><option value="live">Previous model</option></select><button id="drive" aria-pressed="false">Run wheel test</button><button id="steer" aria-pressed="false">Turn wheels</button><button data-view="front">Front</button><button data-view="side">Side</button><button data-view="rear">Rear</button><button data-view="three">3/4</button></nav>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.169.0/examples/jsm/"}}</script>
<script type="module">
import * as T from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{bindVehicleWheelRig}from'./blender-vehicle.js';import{installVehicleEnvironment}from'./vehicle-environment.js';import{addVehicleContactShadow}from'./vehicle-contact-shadow.js';
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x182129);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1;document.body.append(renderer.domElement);
const scene=new T.Scene();installVehicleEnvironment(T,renderer,scene);scene.add(new T.HemisphereLight(0xe3efff,0x5d6261,1.5));const sun=new T.DirectionalLight(0xffffff,2.5);sun.position.set(-4,5,8);scene.add(sun);const fill=new T.DirectionalLight(0xc3d5e9,1);fill.position.set(5,-3,2);scene.add(fill);
const floor=new T.Mesh(new T.PlaneGeometry(200,200),new T.MeshStandardMaterial({color:0x26353d,roughness:.85}));floor.position.z=-.018;scene.add(floor);
const camera=new T.PerspectiveCamera(35,innerWidth/innerHeight,.01,200);camera.up.set(0,0,1);camera.position.set(6,8,3.2);const orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,0,.65);orbit.maxPolarAngle=Math.PI*.49;orbit.minDistance=3;orbit.maxDistance=16;orbit.update();
const models={},loader=new GLTFLoader();let active='candidate',running=false,turning=false,angle=0,last=0;
for(const [id,path]of Object.entries({candidate:'./assets/vehicles/kitt-review/kitt-reference.glb',live:'./assets/vehicles/kitt-review/runtime-before-promotion.glb'})){
 const gltf=await loader.loadAsync(path),root=gltf.scene;root.rotation.x=Math.PI/2;const group=new T.Group();group.add(root);scene.add(group);group.visible=id===active;const rig=bindVehicleWheelRig(T,root);addVehicleContactShadow(T,group);const scanners=[];root.traverse(o=>{if(o.isMesh&&/^Scanner_\d+$/.test(o.name)){o.material=o.material.clone();scanners.push(o);}});models[id]={group,root,rig,scanners};
}
function render(){const m=models[active];m.rig.update(angle,turning?.35:0);const scan=(Math.sin(performance.now()/1000*3.4)+1)*3.5;for(const o of m.scanners)o.material.emissiveIntensity=running?.08+2.8*Math.exp(-Math.pow((Number(o.name.split("_")[1])-scan)/.9,2)):1;renderer.render(scene,camera);document.getElementById('stats').textContent=`${m.rig.wheelbase.toFixed(3)} m wheelbase · ${m.rig.wheels.length} wheel pivots · ${renderer.info.render.triangles.toLocaleString()} triangles · ${renderer.info.render.calls} draw calls`;}
function frame(t){if(last&&running)angle+=(t-last)/1000*3;last=t;if(running)render();requestAnimationFrame(frame);}requestAnimationFrame(frame);orbit.addEventListener('change',render);
document.getElementById('asset').onchange=e=>{active=e.target.value;for(const[id,m]of Object.entries(models))m.group.visible=id===active;render();};document.getElementById('drive').onclick=e=>{running=!running;e.target.setAttribute('aria-pressed',running);e.target.textContent=running?'Pause wheel test':'Run wheel test';render();};document.getElementById('steer').onclick=e=>{turning=!turning;e.target.setAttribute('aria-pressed',turning);render();};
const views={front:[0,9,1.3],side:[9,0,1.3],rear:[0,-9,1.3],three:[6,8,3.2]};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{camera.position.set(...views[b.dataset.view]);orbit.update();render();});window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);render();});window.kittWorkshop={T,models,render,renderer,camera,get active(){return active}};render();
</script></html>
