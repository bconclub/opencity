<!doctype html><html><head><meta charset="utf-8"><title>Vidhana Soudha: OSM2World probe</title>
<style>body{margin:0;background:#b8c8d0;font:15px system-ui}aside{position:absolute;top:12px;left:12px;background:#fff;padding:16px;max-width:370px}a{color:#124979}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.169.0/examples/jsm/"}}</script></head><body>
<aside><b>Vidhana Soudha: OSM2World probe</b><p>Real OSM conversion, LOD 2. Minimal untextured style. Drag to orbit, scroll to zoom.</p><span id="status">Loading...</span><p>Map data © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>.</p></aside>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#b8c8d0');const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,1,20000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.append(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x667766,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(-200,600,300);scene.add(sun);const controls=new OrbitControls(camera,renderer.domElement);
new GLTFLoader().load('vidhana-sample.glb',g=>{scene.add(g.scene);const box=new THREE.Box3().setFromObject(g.scene),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());const d=Math.max(size.x,size.z)*.8;camera.position.copy(center).add(new THREE.Vector3(d*.4,d*.7,d*.7));controls.target.copy(center);controls.update();window.probe={bounds:box,meshCount:g.scene.children.length};document.querySelector('#status').textContent=`${g.scene.children.length} meshes. Drag to inspect.`},undefined,e=>document.querySelector('#status').textContent=e.message);
renderer.setAnimationLoop(()=>renderer.render(scene,camera));window.onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};
</script></body></html>
