<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenCity controller check</title><style>body{background:#11281f;color:#f0f7ed;font:16px system-ui;padding:24px;max-width:700px}button,a{padding:14px;display:inline-block;color:inherit;background:#2b5143;border:1px solid #638b75;border-radius:8px}pre{white-space:pre-wrap;padding:20px;background:#19382b;border-radius:12px}h1{font-size:24px}</style><h1>USB controller check</h1><p>Click Activate, then press A and move your left stick.</p><button id="activate">Activate</button> <a href="./">Open game</a><pre id="state" aria-live="polite">Waiting for controller…</pre><script>
document.getElementById('activate').onclick=()=>document.getElementById('activate').focus();
setInterval(()=>{let pads=[];try{pads=Array.from(navigator.getGamepads?.()||[]).filter(Boolean);document.getElementById('state').textContent=JSON.stringify({secure:window.isSecureContext,focused:document.hasFocus(),api:typeof navigator.getGamepads,controllers:pads.map(p=>({name:p.id,connected:p.connected,mapping:p.mapping,axes:p.axes.map(v=>Math.round(v*100)/100),buttons:p.buttons.map((b,i)=>({i,value:b.value})).filter(b=>b.value>.05)}))},null,2);}catch(e){document.getElementById('state').textContent=e.name+': '+e.message;}},150);
</script></html>
