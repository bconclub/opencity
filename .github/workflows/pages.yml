name: Validate city
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-city-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: node verify-car-physics.mjs && node verify-dynamics.mjs && node verify-dome.mjs && node verify-gamepad-noise.mjs
      - name: Install multiplayer dependencies
        working-directory: multiplayer-server
        run: npm ci --ignore-scripts
      - name: Test multiplayer rooms
        working-directory: multiplayer-server
        run: npm test
      - name: Stage Vercel production app
        run: node stage-production.mjs
      - name: Upload validated production files
        uses: actions/upload-artifact@v4
        with:
          name: public-release
          path: public-release/
          if-no-files-found: error
          retention-days: 7
